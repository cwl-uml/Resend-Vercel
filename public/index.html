<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resend郵件外寄控制台</title>
  
  <!-- Resend 官方 Favicon -->
  <link rel="icon" type="image/svg+xml" href="https://resend.com/static/favicon/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="https://resend.com/favicon.ico">

  <style>
    /* CSS 變數定義 (預設淺色模式) */
    :root {
      --bg-body: #f1f5f9;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-label: #334155;
      --text-sub: #64748b;
      --border-color: #cbd5e1;
      --border-focus: #3b82f6;
      --input-bg: #ffffff;
      --btn-bg: #2563eb;
      --btn-hover: #1d4ed8;
      --btn-disabled: #94a3b8;
      --progress-bg: #e2e8f0;
      --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      
      --alert-success-bg: #ecfdf5;
      --alert-success-border: #a7f3d0;
      --alert-success-text: #065f46;
      
      --alert-error-bg: #fef2f2;
      --alert-error-border: #fecaca;
      --alert-error-text: #991b1b;
    }

    /* 自動偵測系統深色模式 (Dark Mode) */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-body: #0b0f19;
        --bg-card: #151d2f;
        --text-main: #f8fafc;
        --text-label: #cbd5e1;
        --text-sub: #94a3b8;
        --border-color: #334155;
        --border-focus: #60a5fa;
        --input-bg: #0f172a;
        --btn-bg: #3b82f6;
        --btn-hover: #2563eb;
        --btn-disabled: #475569;
        --progress-bg: #1e293b;
        --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);

        --alert-success-bg: #064e3b;
        --alert-success-border: #047857;
        --alert-success-text: #a7f3d0;

        --alert-error-bg: #7f1d1d;
        --alert-error-border: #b91c1c;
        --alert-error-text: #fecaca;
      }
    }

    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-body);
      margin: 0;
      padding: 40px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      color: var(--text-main);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .card {
      background: var(--bg-card);
      width: 100%;
      border-radius: 12px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border-color);
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    /* 登入卡片 */
    #loginCard {
      max-width: 400px;
      padding: 32px 24px;
      margin-top: 40px;
    }
    #loginCard h2 {
      margin: 0 0 8px 0;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      color: var(--text-main);
    }
    #loginCard p {
      font-size: 13px;
      color: var(--text-sub);
      margin: 0 0 20px 0;
      text-align: center;
    }

    /* 發信控制台 */
    #mainDashboard {
      max-width: 620px;
      padding: 28px;
      display: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 14px;
    }
    .header h2 {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      color: var(--text-main);
    }
    .btn-logout {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.15s ease;
    }
    .btn-logout:hover {
      background-color: var(--input-bg);
      color: #ef4444;
      border-color: #ef4444;
    }

    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: var(--text-label);
      font-size: 13px;
    }
    .sub-label {
      font-weight: 400;
      color: var(--text-sub);
      font-size: 12px;
      margin-left: 4px;
      display: inline;
    }

    input[type="text"], input[type="email"], input[type="password"], textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      background-color: var(--input-bg);
      color: var(--text-main);
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.2s ease;
    }
    input:focus, textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }
    textarea {
      resize: vertical;
      min-height: 150px;
      line-height: 1.5;
    }

    .btn-primary {
      width: 100%;
      padding: 13px;
      background-color: var(--btn-bg);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      touch-action: manipulation;
      transition: background-color 0.15s ease;
    }
    .btn-primary:hover:not(:disabled) {
      background-color: var(--btn-hover);
    }
    .btn-primary:disabled {
      background-color: var(--btn-disabled);
      cursor: not-allowed;
    }

    /* 進度條 */
    .progress-container {
      margin-top: 18px;
      display: none;
    }
    .progress-text {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .progress-bar-bg {
      background: var(--progress-bg);
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
    }
    .progress-bar-fill {
      background: var(--border-focus);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* 訊息提示 */
    .alert {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-all;
      display: none;
    }
    .alert-success {
      background-color: var(--alert-success-bg);
      border: 1px solid var(--alert-success-border);
      color: var(--alert-success-text);
    }
    .alert-error {
      background-color: var(--alert-error-bg);
      border: 1px solid var(--alert-error-border);
      color: var(--alert-error-text);
    }

    /* 行動裝置 RWD 樣式 */
    @media (max-width: 640px) {
      body {
        padding: 16px 12px;
      }
      #mainDashboard, #loginCard {
        padding: 20px 16px;
        margin-top: 10px;
        border-radius: 10px;
      }
      .header h2 {
        font-size: 17px;
      }
      input[type="text"], input[type="email"], input[type="password"], textarea {
        font-size: 16px; /* 阻止 iOS Safari 畫面局部自動縮放 */
      }
      .sub-label {
        display: block;
        margin-left: 0;
        margin-top: 2px;
      }
      .btn-primary {
        padding: 14px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- 1. 登入面板 -->
  <div class="card" id="loginCard">
    <h2>🔒 存取驗證</h2>
    <p>請輸入授權金鑰以解鎖發信面板</p>
    <form id="loginForm">
      <div class="form-group">
        <input type="password" id="secretInput" placeholder="請輸入 APP_SECRET" required autocomplete="current-password" autofocus>
      </div>
      <button type="submit" id="loginBtn" class="btn-primary">驗證並解鎖</button>
      <div id="loginAlert" class="alert alert-error"></div>
    </form>
  </div>

  <!-- 2. 發信主面板 -->
  <div class="card" id="mainDashboard">
    <div class="header">
      <h2>✉️ Resend郵件外寄面板</h2>
      <button class="btn-logout" id="logoutBtn" type="button">登出</button>
    </div>

    <form id="mailForm">
      <div class="form-group">
        <label for="customSender">自訂寄件人名稱 <span class="sub-label">(顯示在收信方的抬頭，例如：客服小組)</span></label>
        <input type="text" id="customSender" placeholder="例如：VIP Service Team">
      </div>

      <div class="form-group">
        <label for="fromEmail">Telegram 發信信箱地址 <span class="sub-label">(請輸入完整信箱，例如：jerry9966@niceshop.vip)</span></label>
        <input type="email" id="fromEmail" placeholder="例如：temp123@niceshop.vip" required autocomplete="off">
      </div>

      <div class="form-group">
        <label for="replyTo">指定回覆地址 (Reply-To) <span class="sub-label">(選填，若需引導收件人回信至其他信箱)</span></label>
        <input type="email" id="replyTo" placeholder="選填，例如 yourname@gmail.com">
      </div>

      <div class="form-group">
        <label for="to">收件人 Email</label>
        <input type="email" id="to" placeholder="recipient@example.com" required>
      </div>

      <div class="form-group">
        <label for="subject">郵件主旨</label>
        <input type="text" id="subject" placeholder="請輸入信件主旨" required>
      </div>

      <div class="form-group">
        <label for="content">信件內容</label>
        <textarea id="content" placeholder="請輸入內文（換行會自動保留）..." required></textarea>
      </div>

      <button type="submit" id="submitBtn" class="btn-primary">
        <span id="btnText">確認發送郵件</span>
      </button>
    </form>

    <!-- 發信進度 -->
    <div id="progressBox" class="progress-container">
      <div class="progress-text">
        <span id="progressStatus">正在建立連線...</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progressBar" class="progress-bar-fill"></div>
      </div>
    </div>

    <!-- 結果反饋 -->
    <div id="alertBox" class="alert"></div>
  </div>

  <script>
    const STORAGE_KEY = 'niceshop_auth_key';

    const loginCard = document.getElementById('loginCard');
    const loginForm = document.getElementById('loginForm');
    const secretInput = document.getElementById('secretInput');
    const loginBtn = document.getElementById('loginBtn');
    const loginAlert = document.getElementById('loginAlert');

    const mainDashboard = document.getElementById('mainDashboard');
    const logoutBtn = document.getElementById('logoutBtn');
    const mailForm = document.getElementById('mailForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const progressBox = document.getElementById('progressBox');
    const progressBar = document.getElementById('progressBar');
    const progressStatus = document.getElementById('progressStatus');
    const progressPercent = document.getElementById('progressPercent');
    const alertBox = document.getElementById('alertBox');

    function showDashboard() {
      loginCard.style.display = 'none';
      mainDashboard.style.display = 'block';
    }

    function showLogin() {
      mainDashboard.style.display = 'none';
      loginCard.style.display = 'block';
      secretInput.value = '';
      loginAlert.style.display = 'none';
    }

    async function verifySecret(key) {
      const res = await fetch('/api/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ accessKey: key })
      });
      return res.ok;
    }

    async function initAuthCheck() {
      const cachedKey = localStorage.getItem(STORAGE_KEY);
      if (cachedKey) {
        const isValid = await verifySecret(cachedKey);
        if (isValid) {
          showDashboard();
          return;
        } else {
          localStorage.removeItem(STORAGE_KEY);
        }
      }
      showLogin();
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginBtn.disabled = true;
      loginBtn.textContent = '驗證中...';
      loginAlert.style.display = 'none';

      const enteredKey = secretInput.value.trim();

      try {
        const isValid = await verifySecret(enteredKey);
        if (isValid) {
          localStorage.setItem(STORAGE_KEY, enteredKey);
          showDashboard();
        } else {
          loginAlert.textContent = '金鑰錯誤，拒絕存取';
          loginAlert.style.display = 'block';
        }
      } catch (err) {
        loginAlert.textContent = '連線伺服器失敗，請稍後再試';
        loginAlert.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = '驗證並解鎖';
      }
    });

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      showLogin();
    });

    function updateProgress(percent, text) {
      progressBar.style.width = `${percent}%`;
      progressPercent.textContent = `${percent}%`;
      progressStatus.textContent = text;
    }

    function showAlert(type, html) {
      alertBox.className = `alert alert-${type}`;
      alertBox.innerHTML = html;
      alertBox.style.display = 'block';
    }

    mailForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const currentKey = localStorage.getItem(STORAGE_KEY);

      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      btnText.textContent = '發送中...';
      progressBox.style.display = 'block';

      updateProgress(20, '封裝信件內容中...');

      const payload = {
        accessKey: currentKey,
        customSender: document.getElementById('customSender').value,
        fromEmail: document.getElementById('fromEmail').value,
        replyTo: document.getElementById('replyTo').value,
        to: document.getElementById('to').value,
        subject: document.getElementById('subject').value,
        htmlContent: document.getElementById('content').value
      };

      try {
        await new Promise(r => setTimeout(r, 200));
        updateProgress(50, '呼叫 Resend 發信服務...');

        const response = await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        updateProgress(85, '確認發信回傳狀態...');
        const result = await response.json();

        if (response.status === 401) {
          localStorage.removeItem(STORAGE_KEY);
          showLogin();
          throw new Error('登入憑證已失效，請重新登入');
        }

        if (!response.ok) {
          throw new Error(result.error || '發送過程發生錯誤');
        }

        updateProgress(100, '發送完成');
        showAlert('success', `
          <strong>🎉 郵件已成功寄出！</strong><br>
          <span style="font-size:12px; opacity: 0.85;">Message ID: ${result.data?.id || 'OK'}</span>
        `);

        document.getElementById('subject').value = '';
        document.getElementById('content').value = '';

      } catch (err) {
        updateProgress(100, '發送失敗');
        progressBar.style.backgroundColor = '#ef4444';
        showAlert('error', `<strong>發送失敗：</strong> ${err.message}`);
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = '確認發送郵件';
        setTimeout(() => {
          progressBox.style.display = 'none';
          progressBar.style.backgroundColor = 'var(--border-focus)';
          updateProgress(0, '');
        }, 5000);
      }
    });

    initAuthCheck();
  </script>
</body>
</html>
